<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>저녁 메뉴 투표</title>
<script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore-compat.js"></script>
<style>
  * { box-sizing: border-box; }
  body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; color: #222; background: #fff; margin:0; }
  #app { max-width: 640px; margin: 0 auto; padding: 1.25rem 1rem 3rem; }
  h2 { font-size: 18px; font-weight: 600; margin: 0 0 4px; }
  .sub { font-size: 14px; color: #666; margin: 0 0 1rem; }
  .topbar { display:flex; align-items:center; gap:8px; margin-bottom:12px; padding:10px 12px; background:#f5f5f3; border-radius:8px; }
  .topbar label { font-size:14px; font-weight:600; white-space:nowrap; }
  select, input { padding:8px; border-radius:6px; border:1px solid #ccc; font-size:14px; }
  select#classSelect { flex:1; background:#fff; }
  #classCustom { display:none; width:100px; }
  .tabs { display:flex; gap:8px; margin-bottom:1.25rem; }
  .tabs button { flex:1; padding:10px; border-radius:8px; border:1.5px solid #ccc; background:#fff; color:#333; font-weight:600; cursor:pointer; }
  .tabs button.active { background:#333; color:#fff; border-color:#333; }
  #options { display:flex; gap:10px; margin-bottom:1rem; }
  .opt { flex:1; padding:20px 8px; border-radius:10px; border:2px solid #ddd; background:#fafafa; font-size:15px; font-weight:600; cursor:pointer; }
  .opt span { font-weight:400; font-size:13px; display:block; margin-top:4px; }
  .orderRow { display:flex; align-items:center; gap:10px; margin-bottom:1rem; }
  .orderRow span.big { font-size:18px; font-weight:700; letter-spacing:3px; }
  #resetOrder { margin-left:auto; padding:6px 10px; border-radius:6px; border:1px solid #ccc; background:#fff; font-size:13px; cursor:pointer; }
  #nameInput { width:100%; padding:10px; margin-bottom:12px; }
  #submitVote { width:100%; padding:12px; border-radius:8px; border:none; background:#2d6a4f; color:#fff; font-size:15px; font-weight:600; cursor:pointer; }
  .msg { display:none; margin-top:10px; text-align:center; font-size:14px; font-weight:600; }
  .msg.ok { color:#2d6a4f; }
  .msg.err { color:#c0392b; }
  .section { margin-bottom:1.25rem; padding:14px; border:1px solid #eee; border-radius:10px; }
  .section .title { font-weight:600; font-size:15px; margin-bottom:8px; }
  .row { display:flex; justify-content:space-between; font-size:14px; padding:2px 0; }
  .winner { margin-top:8px; padding-top:8px; border-top:1px dashed #ddd; font-size:14px; }
  #refreshBtn, #clearBtn { padding:8px 12px; border-radius:6px; border:1px solid #ccc; background:#fff; font-size:13px; cursor:pointer; }
  #clearBtn { border-color:#c0392b; color:#c0392b; }
  .resultHeader { display:flex; justify-content:space-between; align-items:center; margin-bottom:1rem; }
  #totalVotes { font-size:14px; color:#666; margin-bottom:1rem; }
  .compareGrid { display:flex; gap:12px; }
  .compareCol { flex:1; min-width:0; }
  .compareCol h3 { font-size:14px; font-weight:700; margin:0 0 8px; padding:6px 10px; background:#f0f0ee; border-radius:6px; text-align:center; }
  @media (max-width:520px) { .compareGrid { flex-direction:column; } }
</style>
</head>
<body>
<div id="app">

  <div class="topbar">
    <label for="classSelect">반 선택</label>
    <select id="classSelect">
      <option value="">-- 반을 선택하세요 --</option>
      <option value="1반">1반</option>
      <option value="2반">2반</option>
      <option value="3반">3반</option>
      <option value="4반">4반</option>
      <option value="5반">5반</option>
      <option value="6반">6반</option>
      <option value="7반">7반</option>
      <option value="8반">8반</option>
      <option value="custom">직접 입력...</option>
    </select>
    <input id="classCustom" placeholder="반 이름" />
  </div>

  <div class="tabs">
    <button id="tabVote" class="active">투표하기</button>
    <button id="tabResult">결과 보기</button>
    <button id="tabCompare">라운드 비교</button>
  </div>

  <div id="voteView">
    <h2>저녁 메뉴 투표</h2>
    <p class="sub">좋아하는 순서대로 눌러주세요. (1지망 → 2지망 → 3지망)</p>

    <div id="options">
      <button class="opt" data-v="A">A<span>찜닭</span></button>
      <button class="opt" data-v="B">B<span>엽떡</span></button>
      <button class="opt" data-v="C">C<span>마라탕</span></button>
    </div>

    <div class="orderRow">
      <span class="sub" style="margin:0;">선택한 순서:</span>
      <span id="orderDisplay" class="big">___</span>
      <button id="resetOrder">지우기</button>
    </div>

    <input id="nameInput" placeholder="이름 (선택)" />

    <div id="voteError" class="msg err"></div>
    <button id="submitVote">투표 제출</button>
    <div id="submitMsg" class="msg ok"></div>
  </div>

  <div id="resultView" style="display:none;">
    <div class="resultHeader">
      <h2 style="margin:0;">투표 결과 (실시간)</h2>
      <button id="refreshBtn">새로고침</button>
    </div>
    <div id="totalVotes"></div>
    <div id="resultsBody"></div>
    <div style="margin-top:1.5rem;padding-top:1rem;border-top:1px solid #eee;">
      <button id="clearBtn">이 반 투표만 초기화 (교사용)</button>
    </div>
  </div>

  <div id="compareView" style="display:none;">
    <div class="resultHeader">
      <h2 style="margin:0;">1차 vs 2차 라운드 비교</h2>
      <button id="refreshCompareBtn">새로고침</button>
    </div>
    <p class="sub">1차: 피자/치킨/떡볶이 · 2차: 찜닭/엽떡/마라탕 (같은 반 기준)</p>
    <div id="compareBody"></div>
  </div>

</div>

<script>
  // ---- Firebase 설정 ----
  const firebaseConfig = {
    apiKey: "AIzaSyDp2IBxy7TLtJvs2hadNP3kqtn604PewN4",
    authDomain: "greenville-vote.firebaseapp.com",
    projectId: "greenville-vote",
    storageBucket: "greenville-vote.firebasestorage.app",
    messagingSenderId: "909166650300",
    appId: "1:909166650300:web:5c7564148c3458c400c1b9"
  };
  firebase.initializeApp(firebaseConfig);
  const db = firebase.firestore();

  const NAMES = {A:'찜닭', B:'엽떡', C:'마라탕'};
  const ROUND1_NAMES = {A:'피자', B:'치킨', C:'떡볶이'};
  const ROUND2_NAMES = {A:'찜닭', B:'엽떡', C:'마라탕'};
  let order = [];

  const classSelect = document.getElementById('classSelect');
  const classCustom = document.getElementById('classCustom');
  classSelect.onchange = ()=>{
    classCustom.style.display = classSelect.value === 'custom' ? 'block' : 'none';
    if(classSelect.value==='custom') classCustom.focus();
    if(resultView.style.display !== 'none') loadResults();
    if(compareView.style.display !== 'none') loadCompare();
  };
  classCustom.oninput = ()=>{
    if(resultView.style.display !== 'none') loadResults();
    if(compareView.style.display !== 'none') loadCompare();
  };
  function getClassId(){
    return classSelect.value === 'custom' ? classCustom.value.trim() : classSelect.value;
  }

  const tabVote = document.getElementById('tabVote');
  const tabResult = document.getElementById('tabResult');
  const tabCompare = document.getElementById('tabCompare');
  const voteView = document.getElementById('voteView');
  const resultView = document.getElementById('resultView');
  const compareView = document.getElementById('compareView');

  function clearTabs(){
    [tabVote, tabResult, tabCompare].forEach(t=>t.classList.remove('active'));
    [voteView, resultView, compareView].forEach(v=>v.style.display='none');
  }
  function showVote(){
    clearTabs(); voteView.style.display='block'; tabVote.classList.add('active');
  }
  function showResult(){
    clearTabs(); resultView.style.display='block'; tabResult.classList.add('active');
    loadResults();
  }
  function showCompare(){
    clearTabs(); compareView.style.display='block'; tabCompare.classList.add('active');
    loadCompare();
  }
  tabVote.onclick = showVote;
  tabResult.onclick = showResult;
  tabCompare.onclick = showCompare;

  const orderDisplay = document.getElementById('orderDisplay');
  document.querySelectorAll('.opt').forEach(btn=>{
    btn.onclick = ()=>{
      const v = btn.dataset.v;
      if(order.includes(v)) return;
      order.push(v);
      updateOrderUI();
    };
  });
  document.getElementById('resetOrder').onclick = ()=>{ order=[]; updateOrderUI(); };

  function updateOrderUI(){
    orderDisplay.textContent = order.length ? order.join('') : '___';
    document.querySelectorAll('.opt').forEach(btn=>{
      const v = btn.dataset.v;
      const idx = order.indexOf(v);
      if(idx>-1){
        btn.style.background='#2d6a4f'; btn.style.color='#fff'; btn.style.borderColor='#2d6a4f';
        btn.querySelector('span').textContent = NAMES[v] + ' (' + (idx+1) + '지망)';
      } else {
        btn.style.background='#fafafa'; btn.style.color='#222'; btn.style.borderColor='#ddd';
        btn.querySelector('span').textContent = NAMES[v];
      }
    });
  }

  const voteError = document.getElementById('voteError');
  const submitMsg = document.getElementById('submitMsg');

  document.getElementById('submitVote').onclick = async ()=>{
    voteError.style.display='none';
    const classId = getClassId();
    if(!classId){
      voteError.textContent = '먼저 위에서 반을 선택해주세요.';
      voteError.style.display='block';
      return;
    }
    if(order.length !== 3){
      voteError.textContent = '세 옵션을 모두 선호 순서대로 눌러주세요.';
      voteError.style.display='block';
      return;
    }
    const name = document.getElementById('nameInput').value.trim();
    try{
      await db.collection('votes_round2').add({
        classId: classId,
        order: order.join(''),
        name: name || null,
        ts: firebase.firestore.FieldValue.serverTimestamp()
      });
      submitMsg.textContent = '제출 완료! (' + order.join('') + ')';
      submitMsg.style.display='block';
      order = [];
      updateOrderUI();
      document.getElementById('nameInput').value='';
    }catch(e){
      voteError.textContent = '제출 중 오류가 발생했습니다: ' + e.message;
      voteError.style.display='block';
    }
  };

  document.getElementById('refreshBtn').onclick = loadResults;

  document.getElementById('clearBtn').onclick = async ()=>{
    const classId = getClassId();
    if(!classId){ alert('먼저 위에서 반을 선택해주세요.'); return; }
    if(!confirm(classId + ' 투표 기록을 삭제할까요? 되돌릴 수 없습니다.')) return;
    try{
      const snap = await db.collection('votes_round2').where('classId','==',classId).get();
      const batch = db.batch();
      snap.forEach(doc => batch.delete(doc.ref));
      await batch.commit();
      loadResults();
    }catch(e){
      alert('초기화 중 오류가 발생했습니다: ' + e.message);
    }
  };

  async function loadResults(){
    const body = document.getElementById('resultsBody');
    const totalEl = document.getElementById('totalVotes');
    const classId = getClassId();
    if(!classId){
      totalEl.textContent = '';
      body.innerHTML = '<p style="color:#888;font-size:14px;">먼저 위에서 반을 선택해주세요.</p>';
      return;
    }
    body.innerHTML = '<p style="color:#888;font-size:14px;">불러오는 중...</p>';
    let votes = [];
    try{
      const snap = await db.collection('votes_round2').where('classId','==',classId).get();
      snap.forEach(doc=>{
        const d = doc.data();
        if(d.order && d.order.length===3) votes.push(d.order);
      });
    }catch(e){
      body.innerHTML = '<p style="color:#c0392b;font-size:14px;">불러오기 오류: ' + e.message + '</p>';
      return;
    }

    totalEl.textContent = classId + ' — 총 ' + votes.length + '표';

    if(votes.length === 0){
      body.innerHTML = '<p style="color:#888;font-size:14px;">아직 제출된 투표가 없습니다.</p>';
      return;
    }

    const fptp = computeFPTP(votes, NAMES);
    const av = computeAV(votes, NAMES);
    const cond = computeCondorcet(votes, NAMES);

    body.innerHTML =
      section('① 최다득표제 (FPTP)', fptp.winner, fptp.rows.map(r=>row(r.label, r.count + '표 (' + r.pct + '%)')), NAMES) +
      section('② 대안투표제 (AV)', av.winner, av.log, NAMES) +
      section('③ 콩도르세 방법 (Condorcet)', cond.winner, cond.rows.map(r=>row(r.label, r.detail)), NAMES);
  }

  document.getElementById('refreshCompareBtn').onclick = loadCompare;

  async function fetchVotes(collectionName, classId){
    const snap = await db.collection(collectionName).where('classId','==',classId).get();
    const votes = [];
    snap.forEach(doc=>{
      const d = doc.data();
      if(d.order && d.order.length===3) votes.push(d.order);
    });
    return votes;
  }

  async function loadCompare(){
    const body = document.getElementById('compareBody');
    const classId = getClassId();
    if(!classId){
      body.innerHTML = '<p style="color:#888;font-size:14px;">먼저 위에서 반을 선택해주세요.</p>';
      return;
    }
    body.innerHTML = '<p style="color:#888;font-size:14px;">불러오는 중...</p>';
    let v1 = [], v2 = [];
    try{
      v1 = await fetchVotes('votes', classId);
      v2 = await fetchVotes('votes_round2', classId);
    }catch(e){
      body.innerHTML = '<p style="color:#c0392b;font-size:14px;">불러오기 오류: ' + e.message + '</p>';
      return;
    }

    body.innerHTML = '<div class="compareGrid">' +
      compareColumn('1차 (피자/치킨/떡볶이)', v1, ROUND1_NAMES) +
      compareColumn('2차 (찜닭/엽떡/마라탕)', v2, ROUND2_NAMES) +
      '</div>';
  }

  function compareColumn(title, votes, namesMap){
    let inner = '<div class="sub" style="margin-bottom:8px;">총 ' + votes.length + '표</div>';
    if(votes.length === 0){
      inner += '<p style="color:#888;font-size:13px;">투표 데이터 없음</p>';
    } else {
      const fptp = computeFPTP(votes, namesMap);
      const av = computeAV(votes, namesMap);
      const cond = computeCondorcet(votes, namesMap);
      inner += section('FPTP', fptp.winner, fptp.rows.map(r=>row(r.label, r.count+'표')), namesMap) +
               section('AV', av.winner, av.log, namesMap) +
               section('Condorcet', cond.winner, cond.rows.map(r=>row(r.label, r.detail)), namesMap);
    }
    return '<div class="compareCol"><h3>' + title + '</h3>' + inner + '</div>';
  }

  function section(title, winner, rows, namesMap){
    return '<div class="section"><div class="title">' + title + '</div>' +
      rows.join('') +
      '<div class="winner"><b>승자: ' + (winner ? namesMap[winner]+' ('+winner+')' : '없음') + '</b></div></div>';
  }
  function row(label, value){
    return '<div class="row"><span>' + label + '</span><span>' + value + '</span></div>';
  }

  function computeFPTP(votes, namesMap){
    const count = {A:0,B:0,C:0};
    votes.forEach(v=> count[v[0]]++ );
    const total = votes.length;
    const rows = ['A','B','C'].map(o=>({label: namesMap[o]+' ('+o+')', count: count[o], pct: total? Math.round(count[o]/total*1000)/10 : 0}));
    let winner = ['A','B','C'].reduce((a,b)=> count[a]>=count[b]?a:b);
    return {rows, winner};
  }

  function computeAV(votes, namesMap){
    let remaining = ['A','B','C'];
    let log = [];
    let round = 1;
    while(true){
      const count = {}; remaining.forEach(o=>count[o]=0);
      votes.forEach(v=>{
        const pref = v.split('').find(c=>remaining.includes(c));
        if(pref) count[pref]++;
      });
      const total = votes.length;
      log.push(row(round + '라운드', remaining.map(o=> namesMap[o]+' '+count[o]+'표').join(' / ')));
      const majorityOpt = remaining.find(o=> total>0 && count[o]/total > 0.5);
      if(majorityOpt || remaining.length===1){
        return {log, winner: majorityOpt || remaining[0]};
      }
      let loser = remaining.reduce((a,b)=> count[a]<=count[b]?a:b);
      log.push(row('탈락', namesMap[loser]+' ('+loser+') 제외'));
      remaining = remaining.filter(o=>o!==loser);
      round++;
      if(round>5) return {log, winner:null};
    }
  }

  function prefers(vote, x, y){ return vote.indexOf(x) < vote.indexOf(y); }
  function computeCondorcet(votes, namesMap){
    const pairs = [['A','B'],['B','C'],['A','C']];
    const results = {};
    const rows = pairs.map(([x,y])=>{
      let xWins=0, yWins=0;
      votes.forEach(v=>{ if(prefers(v,x,y)) xWins++; else yWins++; });
      const w = xWins>yWins ? x : (yWins>xWins ? y : null);
      results[x+y] = w;
      return {label: x+' vs '+y, detail: namesMap[x]+' '+xWins+' : '+yWins+' '+namesMap[y] + (w? ' → '+namesMap[w]+' 승' : ' → 동점')};
    });
    let winner = ['A','B','C'].find(o=>{
      return pairs.every(([x,y])=>{
        if(x!==o && y!==o) return true;
        return results[x+y]===o;
      });
    }) || null;
    return {rows, winner};
  }

  updateOrderUI();
</script>
</body>
</html>
