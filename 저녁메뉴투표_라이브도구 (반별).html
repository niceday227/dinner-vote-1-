<div id="app" style="max-width:640px;margin:0 auto;font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;color:#222;padding:1rem 0;">

<div style="display:flex;align-items:center;gap:8px;margin-bottom:12px;padding:10px 12px;background:#f5f5f3;border-radius:8px;">
  <label for="classSelect" style="font-size:14px;font-weight:600;white-space:nowrap;">반 선택</label>
  <select id="classSelect" style="flex:1;padding:8px;border-radius:6px;border:1px solid #ccc;font-size:14px;background:#fff;">
    <option value="">-- 반을 선택하세요 --</option>
    <option value="1반">1반</option>
    <option value="2반">2반</option>
    <option value="3반">3반</option>
    <option value="4반">4반</option>
    <option value="5반">5반</option>
    <option value="6반">6반</option>
    <option value="7반">7반</option>
    <option value="8반">8반</option>
    <option value="custom">직접 입력...</option>
  </select>
  <input id="classCustom" placeholder="반 이름" style="display:none;width:100px;padding:8px;border-radius:6px;border:1px solid #ccc;font-size:14px;" />
</div>

<div style="display:flex;gap:8px;margin-bottom:1.25rem;">
  <button id="tabVote" style="flex:1;padding:10px;border-radius:8px;border:1.5px solid #333;background:#333;color:#fff;font-weight:600;cursor:pointer;">투표하기</button>
  <button id="tabResult" style="flex:1;padding:10px;border-radius:8px;border:1.5px solid #ccc;background:#fff;color:#333;font-weight:600;cursor:pointer;">결과 보기</button>
</div>

<div id="voteView">
  <h2 style="font-size:18px;font-weight:600;margin:0 0 4px;">저녁 메뉴 투표</h2>
  <p style="font-size:14px;color:#666;margin:0 0 1rem;">좋아하는 순서대로 눌러주세요. (1지망 → 2지망 → 3지망)</p>

  <div id="options" style="display:flex;gap:10px;margin-bottom:1rem;">
    <button class="opt" data-v="A" style="flex:1;padding:20px 8px;border-radius:10px;border:2px solid #ddd;background:#fafafa;font-size:15px;font-weight:600;cursor:pointer;">A<br><span style="font-weight:400;font-size:13px;">피자</span></button>
    <button class="opt" data-v="B" style="flex:1;padding:20px 8px;border-radius:10px;border:2px solid #ddd;background:#fafafa;font-size:15px;font-weight:600;cursor:pointer;">B<br><span style="font-weight:400;font-size:13px;">치킨</span></button>
    <button class="opt" data-v="C" style="flex:1;padding:20px 8px;border-radius:10px;border:2px solid #ddd;background:#fafafa;font-size:15px;font-weight:600;cursor:pointer;">C<br><span style="font-weight:400;font-size:13px;">떡볶이</span></button>
  </div>

  <div style="display:flex;align-items:center;gap:10px;margin-bottom:1rem;">
    <span style="font-size:14px;color:#666;">선택한 순서:</span>
    <span id="orderDisplay" style="font-size:18px;font-weight:700;letter-spacing:3px;">___</span>
    <button id="resetOrder" style="margin-left:auto;padding:6px 10px;border-radius:6px;border:1px solid #ccc;background:#fff;font-size:13px;cursor:pointer;">지우기</button>
  </div>

  <input id="nameInput" placeholder="이름 (선택)" style="width:100%;box-sizing:border-box;padding:10px;border-radius:8px;border:1px solid #ccc;font-size:14px;margin-bottom:12px;" />

  <div id="voteError" style="display:none;color:#c0392b;font-size:13px;margin-bottom:8px;"></div>

  <button id="submitVote" style="width:100%;padding:12px;border-radius:8px;border:none;background:#2d6a4f;color:#fff;font-size:15px;font-weight:600;cursor:pointer;">투표 제출</button>
  <div id="submitMsg" style="display:none;margin-top:10px;text-align:center;font-size:14px;color:#2d6a4f;font-weight:600;"></div>
</div>

<div id="resultView" style="display:none;">
  <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:1rem;">
    <h2 style="font-size:18px;font-weight:600;margin:0;">투표 결과 (실시간)</h2>
    <button id="refreshBtn" style="padding:6px 12px;border-radius:6px;border:1px solid #ccc;background:#fff;font-size:13px;cursor:pointer;">새로고침</button>
  </div>
  <div id="totalVotes" style="font-size:14px;color:#666;margin-bottom:1rem;"></div>

  <div id="resultsBody"></div>

  <div style="margin-top:1.5rem;padding-top:1rem;border-top:1px solid #eee;">
    <button id="clearBtn" style="padding:8px 12px;border-radius:6px;border:1px solid #c0392b;background:#fff;color:#c0392b;font-size:13px;cursor:pointer;">이 반 투표만 초기화 (교사용)</button>
  </div>
</div>

</div>

<script>
(function(){
  const NAMES = {A:'피자', B:'치킨', C:'떡볶이'};
  let order = [];

  const classSelect = document.getElementById('classSelect');
  const classCustom = document.getElementById('classCustom');
  classSelect.onchange = ()=>{
    if(classSelect.value === 'custom'){
      classCustom.style.display='block';
      classCustom.focus();
    } else {
      classCustom.style.display='none';
    }
    if(resultView.style.display !== 'none') loadResults();
  };
  classCustom.oninput = ()=>{ if(resultView.style.display !== 'none') loadResults(); };
  function getClassId(){
    if(classSelect.value === 'custom') return classCustom.value.trim();
    return classSelect.value;
  }

  const tabVote = document.getElementById('tabVote');
  const tabResult = document.getElementById('tabResult');
  const voteView = document.getElementById('voteView');
  const resultView = document.getElementById('resultView');

  function showVote(){
    voteView.style.display='block'; resultView.style.display='none';
    tabVote.style.background='#333'; tabVote.style.color='#fff'; tabVote.style.borderColor='#333';
    tabResult.style.background='#fff'; tabResult.style.color='#333'; tabResult.style.borderColor='#ccc';
  }
  function showResult(){
    voteView.style.display='none'; resultView.style.display='block';
    tabResult.style.background='#333'; tabResult.style.color='#fff'; tabResult.style.borderColor='#333';
    tabVote.style.background='#fff'; tabVote.style.color='#333'; tabVote.style.borderColor='#ccc';
    loadResults();
  }
  tabVote.onclick = showVote;
  tabResult.onclick = showResult;

  const orderDisplay = document.getElementById('orderDisplay');
  document.querySelectorAll('.opt').forEach(btn=>{
    btn.onclick = ()=>{
      const v = btn.dataset.v;
      if(order.includes(v)) return;
      order.push(v);
      updateOrderUI();
    };
  });
  document.getElementById('resetOrder').onclick = ()=>{ order=[]; updateOrderUI(); };

  function updateOrderUI(){
    orderDisplay.textContent = order.length ? order.join('') : '___';
    document.querySelectorAll('.opt').forEach(btn=>{
      const v = btn.dataset.v;
      const idx = order.indexOf(v);
      if(idx>-1){
        btn.style.background='#2d6a4f'; btn.style.color='#fff'; btn.style.borderColor='#2d6a4f';
        btn.querySelector('span').textContent = NAMES[v] + ' (' + (idx+1) + '지망)';
      } else {
        btn.style.background='#fafafa'; btn.style.color='#222'; btn.style.borderColor='#ddd';
        btn.querySelector('span').textContent = NAMES[v];
      }
    });
  }

  const voteError = document.getElementById('voteError');
  const submitMsg = document.getElementById('submitMsg');

  document.getElementById('submitVote').onclick = async ()=>{
    voteError.style.display='none';
    const classId = getClassId();
    if(!classId){
      voteError.textContent = '먼저 위에서 반을 선택해주세요.';
      voteError.style.display='block';
      return;
    }
    if(order.length !== 3){
      voteError.textContent = '세 옵션을 모두 선호 순서대로 눌러주세요.';
      voteError.style.display='block';
      return;
    }
    const key = 'vote:' + classId + ':' + Date.now() + '-' + Math.random().toString(36).slice(2,8);
    const name = document.getElementById('nameInput').value.trim();
    try{
      const res = await window.storage.set(key, JSON.stringify({order: order.join(''), name: name||null}), true);
      if(!res){
        voteError.textContent = '제출에 실패했습니다. 다시 시도해주세요.';
        voteError.style.display='block';
        return;
      }
      submitMsg.textContent = '제출 완료! (' + order.join('') + ')';
      submitMsg.style.display='block';
      order = [];
      updateOrderUI();
      document.getElementById('nameInput').value='';
    }catch(e){
      voteError.textContent = '제출 중 오류가 발생했습니다.';
      voteError.style.display='block';
    }
  };

  document.getElementById('refreshBtn').onclick = loadResults;

  document.getElementById('clearBtn').onclick = async ()=>{
    const classId = getClassId();
    if(!classId){
      alert('먼저 위에서 반을 선택해주세요.');
      return;
    }
    if(!confirm(classId + ' 투표 기록을 삭제할까요? 되돌릴 수 없습니다.')) return;
    try{
      const list = await window.storage.list('vote:' + classId + ':', true);
      if(list && list.keys){
        for(const k of list.keys){
          try{ await window.storage.delete(k, true); }catch(e){}
        }
      }
      loadResults();
    }catch(e){
      alert('초기화 중 오류가 발생했습니다.');
    }
  };

  async function loadResults(){
    const body = document.getElementById('resultsBody');
    const totalEl = document.getElementById('totalVotes');
    const classId = getClassId();
    if(!classId){
      totalEl.textContent = '';
      body.innerHTML = '<p style="color:#888;font-size:14px;">먼저 위에서 반을 선택해주세요.</p>';
      return;
    }
    body.innerHTML = '<p style="color:#888;font-size:14px;">불러오는 중...</p>';
    let votes = [];
    try{
      const list = await window.storage.list('vote:' + classId + ':', true);
      const keys = (list && list.keys) ? list.keys : [];
      for(const k of keys){
        try{
          const r = await window.storage.get(k, true);
          if(r && r.value){
            const parsed = JSON.parse(r.value);
            if(parsed.order && parsed.order.length===3) votes.push(parsed.order);
          }
        }catch(e){}
      }
    }catch(e){}

    totalEl.textContent = classId + ' — 총 ' + votes.length + '표';

    if(votes.length === 0){
      body.innerHTML = '<p style="color:#888;font-size:14px;">아직 제출된 투표가 없습니다.</p>';
      return;
    }

    const fptp = computeFPTP(votes);
    const av = computeAV(votes);
    const cond = computeCondorcet(votes);

    body.innerHTML =
      section('① 최다득표제 (FPTP)', fptp.winner, fptp.rows.map(r=>row(r.label, r.count + '표 (' + r.pct + '%)'))) +
      section('② 대안투표제 (AV)', av.winner, av.log) +
      section('③ 콩도르세 방법 (Condorcet)', cond.winner, cond.rows.map(r=>row(r.label, r.detail)));
  }

  function section(title, winner, rows){
    return '<div style="margin-bottom:1.25rem;padding:14px;border:1px solid #eee;border-radius:10px;">' +
      '<div style="font-weight:600;font-size:15px;margin-bottom:8px;">' + title + '</div>' +
      rows.join('') +
      '<div style="margin-top:8px;padding-top:8px;border-top:1px dashed #ddd;font-size:14px;"><b>승자: ' + (winner ? NAMES[winner]+' ('+winner+')' : '없음') + '</b></div>' +
      '</div>';
  }
  function row(label, value){
    return '<div style="display:flex;justify-content:space-between;font-size:14px;padding:2px 0;"><span>' + label + '</span><span>' + value + '</span></div>';
  }

  function computeFPTP(votes){
    const count = {A:0,B:0,C:0};
    votes.forEach(v=> count[v[0]]++ );
    const total = votes.length;
    const rows = ['A','B','C'].map(o=>({label: NAMES[o]+' ('+o+')', count: count[o], pct: total? Math.round(count[o]/total*1000)/10 : 0}));
    let winner = ['A','B','C'].reduce((a,b)=> count[a]>=count[b]?a:b);
    return {rows, winner};
  }

  function computeAV(votes){
    let remaining = ['A','B','C'];
    let log = [];
    let round = 1;
    while(true){
      const count = {}; remaining.forEach(o=>count[o]=0);
      votes.forEach(v=>{
        const pref = v.split('').find(c=>remaining.includes(c));
        if(pref) count[pref]++;
      });
      const total = votes.length;
      log.push(row(round + '라운드', remaining.map(o=> NAMES[o]+' '+count[o]+'표').join(' / ')));
      const majorityOpt = remaining.find(o=> total>0 && count[o]/total > 0.5);
      if(majorityOpt || remaining.length===1){
        return {log, winner: majorityOpt || remaining[0]};
      }
      let loser = remaining.reduce((a,b)=> count[a]<=count[b]?a:b);
      log.push(row('탈락', NAMES[loser]+' ('+loser+') 제외'));
      remaining = remaining.filter(o=>o!==loser);
      round++;
      if(round>5) return {log, winner:null};
    }
  }

  function prefers(vote, x, y){
    return vote.indexOf(x) < vote.indexOf(y);
  }
  function computeCondorcet(votes){
    const pairs = [['A','B'],['B','C'],['A','C']];
    const results = {};
    const rows = pairs.map(([x,y])=>{
      let xWins=0, yWins=0;
      votes.forEach(v=>{ if(prefers(v,x,y)) xWins++; else yWins++; });
      const w = xWins>yWins ? x : (yWins>xWins ? y : null);
      results[x+y] = w;
      return {label: x+' vs '+y, detail: NAMES[x]+' '+xWins+' : '+yWins+' '+NAMES[y] + (w? ' → '+NAMES[w]+' 승' : ' → 동점')};
    });
    let winner = ['A','B','C'].find(o=>{
      return pairs.every(([x,y])=>{
        if(x!==o && y!==o) return true;
        const w = results[x+y];
        return w===o;
      });
    }) || null;
    return {rows, winner};
  }

  updateOrderUI();
})();
</script>
